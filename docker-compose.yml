version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: senhas_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-senhas_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-senhas_secure_password}
      POSTGRES_DB: ${DATABASE_NAME:-senhas_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/alembic/versions:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-senhas_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senhas_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: senhas_backend
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-senhas_user}:${DATABASE_PASSWORD:-senhas_secure_password}@postgres:5432/${DATABASE_NAME:-senhas_db}
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - senhas_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: senhas_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    networks:
      - senhas_network
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  senhas_network:
    driver: bridge
