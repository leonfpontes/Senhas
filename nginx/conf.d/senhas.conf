# nginx/conf.d/senhas.conf
#
# IMPORTANTE: Substitua "senhas.seudominio.com" pelo seu domínio real.
# Os certificados SSL devem estar em ./certs/ como fullchain.pem e privkey.pem.
# Para obter certificados via Let's Encrypt:
#   certbot certonly --standalone -d senhas.seudominio.com -d api.senhas.seudominio.com
#   cp /etc/letsencrypt/live/senhas.seudominio.com/fullchain.pem ./certs/
#   cp /etc/letsencrypt/live/senhas.seudominio.com/privkey.pem ./certs/

# --- Redirect HTTP → HTTPS ---
server {
    listen 80;
    server_name senhas.seudominio.com api.senhas.seudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Frontend ---
server {
    listen 443 ssl http2;
    server_name senhas.seudominio.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- Backend API ---
server {
    listen 443 ssl http2;
    server_name api.senhas.seudominio.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limit para rotas públicas
    location /api/v1/public/ {
        limit_req zone=public_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit para demais rotas da API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check sem rate limit
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Nginx health (para Docker healthcheck)
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
