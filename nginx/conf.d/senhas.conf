# nginx/conf.d/senhas.conf
#
# Configuração Nginx para girahub.com.br
# API acessada via girahub.com.br/api/ (sem subdomínio)
#
# Para obter certificados via Let's Encrypt:
#   1. Primeiro deploy: use docker-compose.init-ssl.yml (porta 80 only)
#   2. certbot certonly --standalone -d girahub.com.br -d www.girahub.com.br
#   3. cp /etc/letsencrypt/live/girahub.com.br/fullchain.pem ./certs/
#   4. cp /etc/letsencrypt/live/girahub.com.br/privkey.pem ./certs/
#   5. Restart com docker-compose.prod.yml

# ---------------------------------------------------------------------------
# IP real do cliente — necessário porque o nginx está atrás do Docker bridge.
# Sem isso, $binary_remote_addr seria o IP interno do container (172.x.x.x)
# e o rate limit bloquearia TODOS os usuários após N requisições agregadas.
# ---------------------------------------------------------------------------
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# Zonas de rate limit (por IP real do cliente)
# As zonas public_limit e login_limit são definidas no arquivo http pai nginx.conf.
# ---------------------------------------------------------------------------

# --- Redirect HTTP → HTTPS ---
server {
    listen 80;
    server_name girahub.com.br www.girahub.com.br;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx health (for Docker healthcheck)
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://girahub.com.br$request_uri;
    }
}

# --- Redirect www → naked domain ---
server {
    listen 443 ssl http2;
    server_name www.girahub.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://girahub.com.br$request_uri;
}

# --- Main: Frontend + API (single domain) ---
server {
    listen 443 ssl http2;
    server_name girahub.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy — unsafe-inline needed for MUI/Next.js SSR styles.
    # wss: is scoped to this domain only to prevent data exfiltration via external WebSockets.
    # frame-ancestors 'none' replaces X-Frame-Options for CSP-aware browsers.
    # frame-src youtube.com/youtube-nocookie.com: required for Site Builder VideoEmbed sections.
    # googletagmanager + google-analytics: GA4 analytics script and beacon.
    # fonts.googleapis.com + fonts.gstatic.com: Roboto font used throughout the app.
    # sentry.io: error reporting SDK.
    # https: in img-src: tenant logos stored in DB may use absolute HTTPS URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss://girahub.com.br https://*.sentry.io https://www.google-analytics.com https://analytics.google.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none';" always;

    # --- API: /api/ → backend ---
    # --- API pública: emissão de senha (rate limit) ---
    location /api/v1/public/ {
        limit_req zone=public_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Login: rate limit anti brute-force ---
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Refresh token: endpoint público (não exige access_token válido) ---
    location = /api/v1/auth/refresh {
        limit_req zone=refresh_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Endpoints admin e platform requerem JWT — não aplicar rate limit aqui.
        # O rate limit fica apenas em /api/v1/public/ (emissão de senhas)
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket ---
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Health check (no rate limit) ---
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # --- Frontend: everything else ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
