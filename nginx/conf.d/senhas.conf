# nginx/conf.d/senhas.conf
#
# Configuração Nginx para girahub.com.br
# API acessada via girahub.com.br/api/ (sem subdomínio)
#
# Para obter certificados via Let's Encrypt:
#   1. Primeiro deploy: use docker-compose.init-ssl.yml (porta 80 only)
#   2. certbot certonly --standalone -d girahub.com.br -d www.girahub.com.br
#   3. cp /etc/letsencrypt/live/girahub.com.br/fullchain.pem ./certs/
#   4. cp /etc/letsencrypt/live/girahub.com.br/privkey.pem ./certs/
#   5. Restart com docker-compose.prod.yml

# ---------------------------------------------------------------------------
# IP real do cliente — necessário porque o nginx está atrás do Docker bridge.
# Sem isso, $binary_remote_addr seria o IP interno do container (172.x.x.x)
# e o rate limit bloquearia TODOS os usuários após N requisições agregadas.
# ---------------------------------------------------------------------------
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# Zonas de rate limit (por IP real do cliente)
# As zonas public_limit e login_limit são definidas no arquivo http pai nginx.conf.
# ---------------------------------------------------------------------------

# --- Redirect HTTP → HTTPS ---
server {
    listen 80;
    server_name girahub.com.br www.girahub.com.br;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx health (for Docker healthcheck)
    location /nginx-health {
        # Healthcheck do container a cada 30 s — fora do access.log (era ~43% das linhas).
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://girahub.com.br$request_uri;
    }
}

# --- Redirect www → naked domain ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.girahub.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://girahub.com.br$request_uri;
}

# --- Main: Frontend + API (single domain) ---
server {
    # `http2 on;` em vez de `listen ... http2` (obsoleto desde o nginx 1.25.1): o aviso de
    # depreciação saía a cada `nginx -t` do healthcheck (30 s) e era ~88% do error.log.
    listen 443 ssl;
    http2 on;
    server_name girahub.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: agora é gerada pelo Next (frontend/src/middleware.ts),
    # com `nonce` por requisição e SEM `script-src 'unsafe-inline'` (pentest L3).
    # O nginx não seta mais a CSP aqui para não haver dois headers conflitantes —
    # o Next é a fonte única. Os demais headers de segurança acima seguem no nginx.
    # (A lista de hosts/explicações da CSP migrou para o comentário do middleware.)
    # ⚠️ Mudança a validar em staging antes do deploy — ver o PR do CSP nonce.

    # --- API: /api/ → backend ---
    # --- API pública: emissão de senha (rate limit) ---
    location /api/v1/public/ {
        limit_req zone=public_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Login: rate limit anti brute-force ---
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Escolha do terreiro no login (AM-05): mesma zona e mesmo burst do login ---
    # O `location = /api/v1/auth/login` é exato e não cobre este passo. O selection_token vale
    # 5 min e não é de uso único: sem este bloco, o passo ficaria só com o limite do app
    # (slowapi, 10/min por IP), que continua valendo.
    location = /api/v1/auth/login/select {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Trocar de terreiro sem sair (2026-10-09): mesma zona e mesmo burst do login ---
    # Conta com outra senha pede a senha dela neste endpoint: sem este bloco ficaria só no
    # limite do app (slowapi, 10/min por IP), que continua valendo.
    location = /api/v1/auth/trocar-terreiro {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Cadastro de terreiro: mesma zona e mesmo burst do login ---
    # Desde 2026-10-08 o cadastro com e-mail que já tem conta em outro terreiro confere a senha
    # dessa conta (`conta_existente`): sem este bloco ficaria na public_limit (30/min), três vezes
    # o limite do login — virava atalho para adivinhar senha. O slowapi (10/min por IP) também vale.
    location = /api/v1/public/onboarding {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Refresh token: endpoint público (não exige access_token válido) ---
    location = /api/v1/auth/refresh {
        limit_req zone=refresh_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Endpoints admin e platform requerem JWT — não aplicar rate limit aqui.
        # O rate limit fica apenas em /api/v1/public/ (emissão de senhas)
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket ---
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Health check (no rate limit) ---
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # --- Frontend: everything else ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # A landing tem ~155 KB de HTML: com os buffers padrão (8×4k) o nginx gravava cada
        # resposta em /var/cache/nginx/proxy_temp e um [warn] no error.log (o Sentry Uptime
        # pede / a cada minuto). 256 KB por conexão cobre as páginas do Next sem disco.
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
