# T124: Production Docker Compose
# 
# Production-ready services:
# - FastAPI backend (Uvicorn)
# - Next.js frontend (Node.js)
# - PostgreSQL database
# - Redis cache
# - Nginx reverse proxy
# - Prometheus monitoring
# - Secrets management via env files

services:
  # ============================================
  # PostgreSQL Database (Primary)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: senhas-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-senhas_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-senhas_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: senhas-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    # ports NOT exposed to host — only accessible from internal network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    image: ${REGISTRY:-senhas}/senhas-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: senhas-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-senhas_prod}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-senhas_prod}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # API Configuration
      APP_NAME: "Senhas"
      APP_VERSION: ${APP_VERSION:-1.1.0}
      ENVIRONMENT: production
      DEBUG: "false"
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://girahub.com.br}
      
      # Domain (for TrustedHostMiddleware)
      DOMAIN: ${DOMAIN:-girahub.com.br}
      # Internal Docker service names allowed for SSR calls from the frontend container
      EXTRA_ALLOWED_HOSTS: "backend"
      
      # Frontend URL for building public links
      FRONTEND_URL: ${FRONTEND_URL:-http://girahub.com.br}
      
      # Email Services
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_SENDER_EMAIL: ${RESEND_SENDER_EMAIL}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FILE: /var/log/senhas/app.log
      
      # Monitoring
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_PORT: 9090
    volumes:
      - backend_logs:/var/log/senhas
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    image: ${REGISTRY:-senhas}/senhas-frontend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: senhas-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_NAME: Senhas
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.1.0}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Internal API URL for getServerSideProps (server-side Node.js cannot use empty NEXT_PUBLIC_API_BASE_URL)
      INTERNAL_API_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ============================================
  # Nginx Reverse Proxy & SSL
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: senhas-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d is provided by the overlay (init-ssl or ssl)
      - nginx_cache:/var/cache/nginx
      - ./nginx/logs:/var/log/nginx
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      DOMAIN: ${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -f http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ============================================
  # Prometheus Monitoring
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: senhas-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Grafana Dashboards
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: senhas-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - senhas-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  senhas-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_cache:
    driver: local

