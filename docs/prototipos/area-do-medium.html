<title>Área do Médium · Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: no celular o app ocupa a tela; no computador, aparelho de 400 px ao lado do roteiro.
   Área do Médium = identidade nova do site (areia, tinta, café, ouro, Fraunces) com a cor e o logo
   do terreiro nos detalhes (--brand). Telas do dirigente = painel atual do GiraHub (classe .adm). */
:root {
  --page: #efe6d8;
  --bg: #fcf8f2;          /* areia-50 */
  --fg: #2b1d14;          /* tinta */
  --card: #ffffff;
  --border: #eedfc8;      /* areia-200 */
  --muted: #f7eee1;       /* areia-100 */
  --muted-fg: #6a5444;    /* tinta-suave */
  --field: color-mix(in srgb, #6a5444 60%, #ffffff);
  --cafe: #180e09; --cafe-2: #26170f; --on-cafe: #f7eee1; --on-cafe-2: #e0c9a6;
  --ouro: #e9b04a; --ouro-text: #f3cb74;
  --frame: #26170f;
  --brand: #2f6b4f;
  --brand-fg: #ffffff;
  --brand-text: color-mix(in srgb, var(--brand) 86%, #000);
  --brand-soft: color-mix(in srgb, var(--brand) 10%, #ffffff);
  --brand-line: color-mix(in srgb, var(--brand) 30%, var(--border));
  --ok: #24543d; --ok-soft: #e6f1ea;
  --warn: #86391a; --warn-soft: #fbeee3;
  --info: #1e4f72; --info-soft: #e8f0f7;
  --bad: #9f1d1d; --bad-soft: #fbeaea;
  --proto: #6d28d9; --proto-soft: #f1eafd;
  --scrim: rgba(24, 14, 9, 0.55);
  --shadow: 0 1px 2px rgba(43, 29, 20, 0.06), 0 6px 16px -10px rgba(43, 29, 20, 0.18);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 12px; --r-lg: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0805; --bg: #180e09; --fg: #f7eee1; --card: #26170f; --border: rgba(243, 203, 116, 0.14);
    --muted: #3b2519; --muted-fg: #d6c2a6; --field: rgba(247, 238, 225, 0.35); --frame: #3b2519;
    --cafe: #0d0805; --cafe-2: #26170f;
    --brand-text: color-mix(in srgb, var(--brand) 40%, #fff);
    --brand-soft: color-mix(in srgb, var(--brand) 24%, #26170f);
    --brand-line: color-mix(in srgb, var(--brand) 45%, transparent);
    --ok: #9ad1ac; --ok-soft: rgba(110, 190, 140, 0.14);
    --warn: #f5b58a; --warn-soft: rgba(240, 150, 90, 0.15);
    --info: #9cc9ea; --info-soft: rgba(120, 180, 230, 0.14);
    --bad: #f5a3a3; --bad-soft: rgba(240, 110, 110, 0.15);
    --proto: #c4b5fd; --proto-soft: rgba(139, 92, 246, 0.18);
    --scrim: rgba(0, 0, 0, 0.6); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0805; --bg: #180e09; --fg: #f7eee1; --card: #26170f; --border: rgba(243, 203, 116, 0.14);
  --muted: #3b2519; --muted-fg: #d6c2a6; --field: rgba(247, 238, 225, 0.35); --frame: #3b2519;
  --cafe: #0d0805; --cafe-2: #26170f;
  --brand-text: color-mix(in srgb, var(--brand) 40%, #fff);
  --brand-soft: color-mix(in srgb, var(--brand) 24%, #26170f);
  --brand-line: color-mix(in srgb, var(--brand) 45%, transparent);
  --ok: #9ad1ac; --ok-soft: rgba(110, 190, 140, 0.14);
  --warn: #f5b58a; --warn-soft: rgba(240, 150, 90, 0.15);
  --info: #9cc9ea; --info-soft: rgba(120, 180, 230, 0.14);
  --bad: #f5a3a3; --bad-soft: rgba(240, 110, 110, 0.15);
  --proto: #c4b5fd; --proto-soft: rgba(139, 92, 246, 0.18);
  --scrim: rgba(0, 0, 0, 0.6); --shadow: none;
  color-scheme: dark;
}
/* Painel do terreiro (identidade atual do admin: slate + cor da casa no primário). */
.adm {
  --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --border: #e2e8f0; --muted: #f1f5f9; --muted-fg: #5b6b80;
  --field: #cbd5e1; --display: var(--sans);
  --brand-soft: color-mix(in srgb, var(--brand) 9%, #ffffff);
  --ok: #1b5e20; --ok-soft: #e8f3e9; --warn: #9a3412; --warn-soft: #fdf0e7; --info: #075985; --info-soft: #e6f3fa; --bad: #b71c1c; --bad-soft: #fbeaea;
  --shadow: none; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .adm {
    --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --border: rgba(255,255,255,0.09); --muted: #273449; --muted-fg: #a3b1c6; --field: rgba(255,255,255,0.2);
    --brand-soft: color-mix(in srgb, var(--brand) 24%, #1e293b);
    --ok: #81c784; --ok-soft: rgba(102,187,106,0.14); --warn: #ffb74d; --warn-soft: rgba(255,167,38,0.14); --info: #4fc3f7; --info-soft: rgba(41,182,246,0.14); --bad: #fca5a5; --bad-soft: rgba(248,113,113,0.14);
  }
}
:root[data-theme="dark"] .adm {
  --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --border: rgba(255,255,255,0.09); --muted: #273449; --muted-fg: #a3b1c6; --field: rgba(255,255,255,0.2);
  --brand-soft: color-mix(in srgb, var(--brand) 24%, #1e293b);
  --ok: #81c784; --ok-soft: rgba(102,187,106,0.14); --warn: #ffb74d; --warn-soft: rgba(255,167,38,0.14); --info: #4fc3f7; --info-soft: rgba(41,182,246,0.14); --bad: #fca5a5; --bad-soft: rgba(248,113,113,0.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font: 16px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand-text); }

.stage { height: 100%; display: flex; justify-content: center; }
.device { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
.panel { display: none; }
@media (min-width: 900px) {
  .stage { align-items: center; gap: 40px; padding: 24px; }
  .device { width: 400px; height: min(860px, 100%); border: 10px solid var(--frame); border-radius: 42px; box-shadow: 0 30px 60px -20px rgba(24,14,9,0.4); }
  .panel { display: flex; flex-direction: column; gap: 14px; width: 360px; max-height: 100%; overflow-y: auto; padding-right: 4px; }
  .protobar { display: none !important; }
}

.protobar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px; background: var(--proto-soft); color: var(--proto); font-size: 13px; font-weight: 600; border-bottom: 1px dashed var(--proto); }
.protobar button { border: 1px solid var(--proto); background: transparent; color: var(--proto); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }

/* ——— cabeçalhos ——— */
.appbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 3px solid var(--brand); min-height: 66px; }
.appbar .t { min-width: 0; }
.appbar .t strong { display: block; font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.appbar .t span { display: block; font-size: 13px; color: var(--muted-fg); }
.adm .appbar { background: var(--card); border-bottom: 1px solid var(--border); }
.adm .appbar .t strong { font-weight: 700; font-size: 16px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--brand-text); font-weight: 700; padding: 8px 4px; margin-left: -4px; min-height: 44px; }
.avatar { margin-left: auto; flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--muted); font-weight: 800; font-size: 13px; }
.emblem { flex: none; display: block; }

.hero { background: var(--cafe); color: var(--on-cafe); padding: 20px 16px 22px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 40%, var(--ouro))); }
.hero .casa { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--on-cafe-2); }
.hero h1 { font-family: var(--display); font-size: 30px; line-height: 1.1; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
.hero p { color: var(--on-cafe-2); font-size: 15.5px; }
.hero .eyebrow-ouro { font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ouro-text); }

.screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.pad { padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 22px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2, .eyebrow-sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brand-text); font-weight: 800; }
.adm .section > h2 { letter-spacing: 0.06em; color: var(--muted-fg); font-size: 12.5px; }
.title { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; }
.adm .title { font-size: 22px; letter-spacing: 0; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); text-align: left; color: inherit; width: 100%; }
.card.tint { background: var(--brand-soft); border-color: var(--brand-line); box-shadow: none; }
.card .eyebrow { font-size: 13px; font-weight: 700; color: var(--brand-text); display: flex; align-items: center; gap: 6px; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.25; }
.adm .card h3 { font-weight: 700; font-size: 17px; }
.card .sub { color: var(--muted-fg); font-size: 15px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.meta { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.meta div { display: flex; gap: 10px; align-items: flex-start; }
.meta svg { flex: none; margin-top: 2px; color: var(--brand-text); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-size: 16px; font-weight: 700; text-decoration: none; text-align: center; }
.btn-primary { background: var(--brand); color: var(--brand-fg); }
.btn-outline { background: var(--card); color: var(--fg); border-color: var(--field); }
.btn-soft { background: var(--brand-soft); color: var(--brand-text); }
.btn-danger { background: var(--card); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--card)); }
.btn-big { min-height: 66px; font-size: 21px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 12px; font-size: 14.5px; border-radius: 10px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--brand-text); font-weight: 700; padding: 8px 0; text-align: left; min-height: 44px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.brand { background: var(--brand-soft); color: var(--brand-text); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted { background: var(--muted); color: var(--muted-fg); }

.note { font-size: 14px; color: var(--muted-fg); }
.status { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); font-size: 15px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.info { background: var(--info-soft); color: var(--info); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status svg { flex: none; margin-top: 2px; }

.list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; width: 100%; min-height: 64px; color: inherit; }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .grow strong { font-size: 16px; line-height: 1.3; }
.item .grow span { font-size: 14px; color: var(--muted-fg); }
.item .chev { color: var(--muted-fg); flex: none; }
.item .lead-ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; }
.date { flex: none; width: 54px; text-align: center; border-radius: 14px; padding: 6px 0; background: var(--muted); }
.date b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.05; }
.date small { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.06em; }
.date.brand { background: var(--brand); color: var(--brand-fg); }
.date.brand small { color: color-mix(in srgb, var(--brand-fg) 82%, transparent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; min-height: 40px; color: inherit; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }

.month { font-family: var(--display); font-size: 18px; font-weight: 600; padding: 2px; }
.adm .month { font-family: var(--sans); font-weight: 800; font-size: 15px; }
.box { background: var(--muted); border-radius: var(--r); padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.box strong { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--muted); border-radius: 10px; padding: 10px 12px; user-select: all; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-fg); font-family: var(--display); font-weight: 700; font-size: 15px; }
.step .c { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.amount { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-weight: 700; font-size: 15px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--field); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 50px; }
.field textarea { min-height: 110px; resize: vertical; }
.pwd { position: relative; }
.pwd button { position: absolute; right: 6px; top: 7px; border: 0; background: transparent; color: var(--brand-text); font-weight: 700; font-size: 14px; min-height: 36px; padding: 0 10px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.check input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--brand); }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; border: 0; background: transparent; color: var(--muted-fg); font-size: 12.5px; font-weight: 600; padding: 6px 2px; }
.tab[aria-current="page"] { color: var(--brand-text); font-weight: 800; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.adm .tab { font-size: 11px; min-height: 56px; }
.tab.plus span.pl { width: 42px; height: 42px; border-radius: 14px; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; }

.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92%; overflow-y: auto; background: var(--card); color: var(--fg); border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .22s ease-out; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--border); align-self: center; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.2; }
.adm .sheet h2 { font-size: 20px; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.toast { position: absolute; left: 16px; right: 16px; bottom: 80px; z-index: 30; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4); }

.qr { align-self: center; background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
.qr img, .qr canvas { display: block; width: 180px; height: 180px; }
.thumb { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 12px; }
.thumb img { width: 56px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--muted); }
.thumb .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.thumb .grow strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.receipt { width: 100%; max-width: 240px; align-self: center; border-radius: 10px; border: 1px solid var(--border); }

.wa .bubble { background: var(--card); border: 1px solid var(--border); border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 15.5px; display: flex; flex-direction: column; gap: 8px; max-width: 92%; box-shadow: var(--shadow); }
.wa .bubble time { align-self: flex-end; font-size: 12px; color: var(--muted-fg); }
.tag-sim { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--proto); background: var(--proto-soft); border-radius: 6px; padding: 3px 8px; }

.areas { display: flex; flex-direction: column; gap: 12px; }
.area { display: flex; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: 20px; padding: 18px 16px; min-height: 96px; color: inherit; box-shadow: var(--shadow); }
.area .ic { flex: none; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); }
.area strong { display: block; font-family: var(--display); font-weight: 600; font-size: 19px; }
.area span { display: block; font-size: 14px; color: var(--muted-fg); }
.big-pct { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1; color: var(--brand-text); font-variant-numeric: tabular-nums; }
details.acc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0 16px; }
details.acc summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc[open] summary svg { transform: rotate(90deg); }
details.acc .in { padding-bottom: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--muted); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 700; color: var(--muted-fg); padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.auth { background: var(--bg); }
.gh { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.gh svg { color: #f59e0b; }
.icon-tile { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--brand); box-shadow: 0 6px 14px -6px rgba(0,0,0,0.35); }
.homescreen { display: flex; gap: 18px; justify-content: center; padding: 16px; border-radius: 18px; background: linear-gradient(160deg, #3b2519, #180e09); }
.homescreen .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #f7eee1; font-weight: 600; }
.homescreen .ghost { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,0.12); }
.footer-gh { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-fg); padding-top: 4px; }
.footer-gh svg { color: #f59e0b; }

/* painel */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; text-align: left; color: inherit; }
.kpi b { font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--muted-fg); line-height: 1.25; }
.kpi.alert b { color: var(--warn); }
.bar { height: 8px; border-radius: 4px; background: var(--muted); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { font-size: 12px; font-weight: 800; color: var(--muted-fg); text-align: center; padding: 2px 0; }
.cal .d { position: relative; min-height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 2px; font-size: 13px; font-weight: 700; color: inherit; gap: 2px; }
.cal .d.sat { background: var(--muted); }
.cal .d.empty { border: 0; background: transparent; }
.cal .g { font-size: 10.5px; font-weight: 800; color: #fff; border-radius: 5px; padding: 0 4px; line-height: 15px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid transparent; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 15px; background: var(--card); color: inherit; box-shadow: 0 0 0 1px var(--border); min-height: 44px; }
.gchip i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.gchip[aria-pressed="true"] { border-color: var(--fg); box-shadow: none; }
.gchip small { font-weight: 600; color: var(--muted-fg); font-size: 13px; }
.mark { display: flex; gap: 6px; }
.mark button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--field); background: var(--card); font-weight: 700; font-size: 14px; color: inherit; }
.mark button[aria-pressed="true"].p { background: var(--ok); border-color: var(--ok); color: #fff; }
.mark button[aria-pressed="true"].a { background: var(--bad); border-color: var(--bad); color: #fff; }

/* roteiro */
.panel h1 { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.panel .lead { color: var(--muted-fg); font-size: 14.5px; }
.pcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.pcard > strong { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted-fg); padding: 0 8px 4px; }
.journey { display: flex; gap: 10px; align-items: flex-start; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 10px; width: 100%; color: inherit; }
.journey:hover { background: var(--muted); }
.journey .j { flex: none; font-size: 12px; font-weight: 800; color: var(--proto); background: var(--proto-soft); border-radius: 6px; padding: 2px 6px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.journey b { display: block; font-size: 14.5px; }
.journey span { display: block; font-size: 13.5px; color: var(--muted-fg); }
.task { background: var(--proto-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; border-left: 3px solid var(--proto); }
.task b { color: var(--proto); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 4px 8px; flex-wrap: wrap; }
.swatches { display: flex; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14.5px; padding: 4px 8px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--proto); }
.small-btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; color: inherit; }

  function copyText(t, okMsg) {
    try { navigator.clipboard.writeText(t).then(function () { toast(okMsg); }, function () { toast('Toque e segure o texto para copiar.'); }); }
    catch (e) { toast('Toque e segure o texto para copiar.'); }
  }
  function compById(id) {
    if (id === 'ana') return { id: 'ana', nome: 'Ana Paula Ribeiro', valor: 'R$ 50,00', quando: 'Hoje, ' + S.enviadoEm };
    for (var i = 0; i < S.comps.length; i++) if (S.comps[i].id === id) return S.comps[i];
  }

  /* ——————————————— eventos ——————————————— */
  function onClick(e) {
    var el = e.target.closest('[data-go],[data-act],[data-tab]'); if (!el) return;
    if (el.tagName === 'INPUT') return; // checkboxes tratados no change
    var a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
    if (el.dataset.tab) return tab(el.dataset.tab);
    if (el.dataset.go) return go(el.dataset.go, { id: id });
    switch (a) {
      case 'back': return back();
      case 'proto': return sheet('proto');
      case 'fechar': S.sheet = null; return render();
      case 'vou': S.escala[id] = { resp: 'vou' }; return toast('Combinado! A casa já sabe que você vai.');
      case 'naovou': return sheet('naovou', { id: id });
      case 'mudar': delete S.escala[id]; return render();
      case 'enviar-motivo': { var m = (document.getElementById('motivo').value || '').trim(); if (!m) return; S.escala[S.sheetData.id] = { resp: 'nao', motivo: m }; S.sheet = null; return toast('A casa foi avisada. Obrigado por avisar.'); }
      case 'justificar': return sheet('justificar', { id: id });
      case 'enviar-just': { var mj = (document.getElementById('motivo').value || '').trim(); if (!mj) return; S.justificados[S.sheetData.id] = mj; S.sheet = null; return toast('Motivo enviado para a casa.'); }
      case 'cheguei': S.cheguei[id] = true; return toast('Presença marcada. Bom trabalho!');
      case 'pagar': return sheet('pagar');
      case 'comprovante': return sheet('comprovante');
      case 'copiar':
        if (v === 'code') return copyText(PIX_CODE, 'Código copiado. Abra o app do banco e escolha PIX copia e cola.');
        if (v === 'chave') return copyText(CASA.pix, 'Chave PIX copiada.');
        return copyText(el.dataset.txt, 'Copiado.');
      case 'exemplo': S.file = { name: 'comprovante-pix.png', size: '84 KB', url: receiptImg('R$ 50,00') }; return render();
      case 'trocar-arq': S.file = null; return render();
      case 'enviar-comp': S.mensal = 'conferencia'; S.enviadoEm = now(); S.sheet = null; S.file = null; if (S.screen !== 'mensalidade') { S.history = []; S.screen = 'mensalidade'; } return toast('Comprovante enviado. A casa vai conferir.');
      case 'filtro': S.agendaFiltro = v; return render();
      case 'agendacel': return toast('No app, isso baixa o evento para a agenda do celular (Google ou Apple).');
      case 'divulgar': return sheet('divulgar', { id: id });
      case 'falar': return sheet('falar');
      case 'instalar': return sheet('instalar');
      case 'plat': S.sheetData.plat = v; return render();
      case 'termo': return sheet('termo');
      case 'showpw': { var inp = el.parentNode.querySelector('input'), show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.textContent = show ? 'Ocultar' : 'Mostrar'; return; }
      case 'ativar': {
        var pw = document.getElementById('pw').value, ok = document.getElementById('termo').checked, err = document.getElementById('err'), msg = document.getElementById('errmsg');
        if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) { msg.textContent = 'A senha precisa ter 8 ou mais caracteres, com letras e números.'; err.hidden = false; return; }
        if (!ok) { msg.textContent = 'Para ativar, marque que você autoriza o uso dos seus dados.'; err.hidden = false; return; }
        S.history = []; S.screen = 'inicio'; render(); return sheet('instalar');
      }
      case 'entrar': S.history = []; if (S.persona === 'operador') return go('escolher-area', {}, { replace: true }); if (S.persona === 'dirigente') return tab('adm-inicio'); return tab('inicio');
      case 'esqueci': return sheet('esqueci');
      case 'enviar-reset': S.sheet = null; return toast('Se o e-mail tiver acesso, chega um link em alguns minutos.');
      case 'area': { var lb = document.getElementById('lembrar'); if (lb) S.lembrar = lb.checked; S.sheet = null; return v === 'painel' ? tab('adm-inicio') : tab('inicio'); }
      case 'sair': S.history = []; return go('login', {}, { replace: true });
      case 'journey': { var jj = J[+el.dataset.i]; S.task = jj; S.sheet = null; jj.start(); return; }
      case 'sim-mensal': S.mensal = v; S.recusa = ''; S.sheet = null; return render();
      case 'brand': document.documentElement.style.setProperty('--brand', v); try { localStorage.setItem('am-proto-brand2', v); } catch (e2) {} return render();
      case 'reset': S = fresh(); return render();
      case 'ver-medium': asMedium(); S.sheet = null; return tab('inicio');
      case 'ver-painel': if (S.persona === 'medium') S.persona = 'dirigente'; S.sheet = null; return tab('adm-inicio');
      // painel
      case 'existe': return toast(v + ': tela que já existe no painel.');
      case 'menu': return sheet('menu');
      case 'medfiltro': S.admMedFiltro = v; return render();
      case 'medium-acesso': return sheet('acesso', { id: id });
      case 'convidar': case 'convidar-link': {
        var md; S.mediuns.forEach(function (x) { if (x.id === id) md = x; }); md.acesso = 'convite'; md.enviado = 'hoje';
        if (a === 'convidar') { S.sheet = null; return toast('No app, abre o WhatsApp de ' + md.nome.split(' ')[0] + ' com a mensagem pronta. Convite também enviado por e-mail.'); }
        S.sheet = null; return copyText('girahub.com.br/convite/k7Q2-exemplo', 'Link do convite copiado.');
      }
      case 'revogar': { var mr; S.mediuns.forEach(function (x) { if (x.id === id) mr = x; }); var era = mr.acesso; mr.acesso = 'sem'; S.sheet = null; return toast(era === 'ativo' ? 'Acesso retirado. ' + mr.nome.split(' ')[0] + ' saiu da Área.' : 'Convite cancelado.'); }
      case 'convidar-todos': return sheet('convidar-todos');
      case 'convidar-todos-ok': { var n = 0; S.mediuns.forEach(function (x) { if (x.acesso === 'sem' && x.email) { x.acesso = 'convite'; x.enviado = 'hoje'; n++; } }); S.sheet = null; return toast(n + ' convites enviados por e-mail.'); }
      case 'leitura': S.leituraAba = v; return render();
      case 'lembrar-leitura': return sheet('lembrar-leitura');
      case 'av-para': syncAviso(); S.avisoNovo.para = v; return render();
      case 'av-quando': syncAviso(); S.avisoNovo.quando = v; return render();
      case 'av-preview': syncAviso(); return sheet('av-preview');
      case 'av-publicar': {
        syncAviso(); var nv = S.avisoNovo;
        if (!nv.titulo.trim() || !nv.corpo.trim()) { document.getElementById('av-err').hidden = false; return; }
        var paraTxt = { todos: 'todos', G1: 'Grupo G1', G2: 'Grupo G2', G3: 'Grupo G3', atendimento: 'médiuns de atendimento' }[nv.para];
        S.avisos.unshift({ id: 'n' + Date.now(), novo: nv.quando === 'agora' && (nv.para === 'todos' || nv.para === 'G2'), fixado: nv.fixar, titulo: nv.titulo.trim(), corpo: nv.corpo.trim(), data: '07/10', leram: 0, para: paraTxt, agendado: nv.quando === 'agendar' ? '08/10, 8h' : null });
        S.avisoNovo = { titulo: '', corpo: '', para: 'todos', fixar: false, quando: 'agora' };
        S.history = []; go('adm-avisos', {}, { replace: true });
        return toast(nv.quando === 'agora' ? 'Aviso publicado. A Ana (G2) já vê na Área do Médium.' : 'Aviso agendado para 08/10 às 8h.');
      }
      case 'finfiltro': S.finFiltro = v; return render();
      case 'ver-comp': return sheet('comp', { c: compById(id) });
      case 'comp-ok': { var c = S.sheetData.c; if (c.id === 'ana') S.mensal = 'paga'; else S.comps = S.comps.filter(function (x) { return x.id !== c.id; }); S.sheet = null; return toast('Pagamento de ' + c.nome.split(' ')[0] + ' confirmado e lançado em contas a receber.'); }
      case 'comp-recusar': S.sheetData.recusar = true; return render();
      case 'comp-motivo': S.sheetData.motivo = v; return render();
      case 'comp-recusar-ok': {
        var mt = (document.getElementById('comp-m').value || '').trim(); if (!mt) { document.getElementById('comp-m').focus(); return; }
        var cc = S.sheetData.c; if (cc.id === 'ana') { S.mensal = 'recusado'; S.recusa = mt; } else S.comps = S.comps.filter(function (x) { return x.id !== cc.id; });
        S.sheet = null; return toast(cc.nome.split(' ')[0] + ' foi avisada e pode enviar outro comprovante.');
      }
      case 'pl-copiar': S.plano.iniciado = true; S.plano.dias = { 7: ['G1'], 14: ['G2'], 21: ['G1'], 28: ['G2'] }; return toast('Copiado de outubro pela ordem dos sábados. O G3 não tem 5º sábado em novembro.');
      case 'pl-vazio': S.plano.iniciado = true; S.plano.dias = {}; return render();
      case 'pl-sel': S.plano.sel = v; return render();
      case 'pl-dia': { var ds = S.plano.dias[v] || [], g = S.plano.sel, k = ds.indexOf(g); if (k === -1) ds.push(g); else ds.splice(k, 1); if (ds.length) S.plano.dias[v] = ds; else delete S.plano.dias[v]; return render(); }
      case 'pl-girar': { var nx = { G1: 'G2', G2: 'G3', G3: 'G1' }; Object.keys(S.plano.dias).forEach(function (d) { S.plano.dias[d] = S.plano.dias[d].map(function (x) { return nx[x]; }); }); return toast('Grupos girados: o G2 pegou os dias do G1, o G3 os do G2 e o G1 os do G3.'); }
      case 'pl-sabados': { var ord = ['G1', 'G2', 'G3'], i = 0, nd = {}; for (var d = 1; d <= 30; d++) if (new Date(2026, 10, d).getDay() === 6) nd[d] = [ord[i++ % 3]]; S.plano.dias = nd; return toast('Sábados distribuídos em ordem: G1, G2, G3.'); }
      case 'pl-rascunho': return toast('Rascunho salvo. Os médiuns ainda não veem.');
      case 'pl-publicar': if (!Object.keys(S.plano.dias).length) return toast('Escolha pelo menos um dia.'); return sheet('pl-publicar');
      case 'pl-publicar-ok': S.plano.publicado = true; S.sheet = null; return toast('Faxina de novembro publicada. A Ana (G2) já vê os dias dela na agenda.');
      case 'marca': S.chamada.f1[id] = S.chamada.f1[id] === v ? undefined : v; return render();
      case 'marca-confirmados': { var r = S.escala.f1; S.chamada.f1.ela = 'p'; if ((r && r.resp === 'vou') || S.cheguei.f1) S.chamada.f1.ana = 'p'; return toast('Quem confirmou ficou como presente.'); }
      case 'encerrar': return sheet('encerrar');
      case 'encerrar-ok': ['ana', 'ela', 'hel', 'mar'].forEach(function (k) { if (!S.chamada.f1[k]) S.chamada.f1[k] = 'a'; }); S.chamadaEncerrada = true; S.sheet = null; return toast('Chamada encerrada.');
    }
  }
  function syncAviso() {
    var t = document.getElementById('av-t'), c = document.getElementById('av-c'), f = document.getElementById('av-fix');
    if (t) S.avisoNovo.titulo = t.value; if (c) S.avisoNovo.corpo = c.value; if (f) S.avisoNovo.fixar = f.checked;
  }
  document.addEventListener('click', function (e) { if (device.contains(e.target) || panel.contains(e.target)) onClick(e); });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'motivo') { var b = device.querySelector('[data-act="enviar-motivo"],[data-act="enviar-just"]'); if (b) b.disabled = !e.target.value.trim(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'arq' && t.files && t.files[0]) {
      var f = t.files[0], kb = Math.round(f.size / 1024);
      S.file = { name: f.name, size: kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB', url: /^image\//.test(f.type) ? URL.createObjectURL(f) : receiptImg('R$ 50,00') };
      render();
    }
    if (t.dataset && t.dataset.act === 'diafaxina') { S.diaFaxina = t.checked; if (S.diaFaxina) delete S.escala.f1; render(); }
  });

  render();
})();
</script>
