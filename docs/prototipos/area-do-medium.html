<title>Área do Médium · Protótipo</title>
<style>
/* Layout: no celular, o app ocupa a tela; no computador, aparelho de 400 px ao lado do roteiro de jornadas.
   Tokens seguem o painel do GiraHub (globals.css): neutros slate, cor da casa via --brand (applyBrand). */
:root {
  --page: #e9edf3;
  --bg: #f8fafc;
  --fg: #0f172a;
  --card: #ffffff;
  --border: #e2e8f0;
  --muted: #f1f5f9;
  --muted-fg: #5b6b80;
  --frame: #1e293b;
  --brand: #2f6b4f;
  --brand-fg: #ffffff;
  --brand-text: color-mix(in srgb, var(--brand) 88%, #000);
  --brand-soft: color-mix(in srgb, var(--brand) 11%, var(--card));
  --ok: #1b5e20;   --ok-soft: #e8f3e9;
  --warn: #9a3412; --warn-soft: #fdf0e7;
  --info: #075985; --info-soft: #e6f3fa;
  --bad: #b71c1c;  --bad-soft: #fbeaea;
  --proto: #6d28d9; --proto-soft: #f1eafd;
  --scrim: rgba(15, 23, 42, 0.5);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #070b14; --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --border: rgba(255,255,255,0.09);
    --muted: #273449; --muted-fg: #a3b1c6; --frame: #334155;
    --brand-text: color-mix(in srgb, var(--brand) 42%, #fff);
    --brand-soft: color-mix(in srgb, var(--brand) 26%, var(--card));
    --ok: #81c784; --ok-soft: rgba(102,187,106,0.14);
    --warn: #ffb74d; --warn-soft: rgba(255,167,38,0.14);
    --info: #4fc3f7; --info-soft: rgba(41,182,246,0.14);
    --bad: #fca5a5; --bad-soft: rgba(248,113,113,0.14);
    --proto: #c4b5fd; --proto-soft: rgba(139,92,246,0.16);
    --scrim: rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #070b14; --bg: #0f172a; --fg: #f1f5f9; --card: #1e293b; --border: rgba(255,255,255,0.09);
  --muted: #273449; --muted-fg: #a3b1c6; --frame: #334155;
  --brand-text: color-mix(in srgb, var(--brand) 42%, #fff);
  --brand-soft: color-mix(in srgb, var(--brand) 26%, var(--card));
  --ok: #81c784; --ok-soft: rgba(102,187,106,0.14);
  --warn: #ffb74d; --warn-soft: rgba(255,167,38,0.14);
  --info: #4fc3f7; --info-soft: rgba(41,182,246,0.14);
  --bad: #fca5a5; --bad-soft: rgba(248,113,113,0.14);
  --proto: #c4b5fd; --proto-soft: rgba(139,92,246,0.16);
  --scrim: rgba(0,0,0,0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 60%, transparent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand-text); }

.stage { height: 100%; display: flex; justify-content: center; }
.device { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
.panel { display: none; }

@media (min-width: 900px) {
  .stage { align-items: center; gap: 40px; padding: 24px; }
  .device { width: 400px; height: min(860px, 100%); border: 10px solid var(--frame); border-radius: 40px;
    box-shadow: 0 30px 60px -20px rgba(15,23,42,0.35); }
  .panel { display: flex; flex-direction: column; gap: 16px; width: 340px; max-height: 100%; overflow-y: auto; padding-right: 4px; }
  .protobar { display: none !important; }
}

/* ——— barra do protótipo (só celular) ——— */
.protobar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px;
  background: var(--proto-soft); color: var(--proto); font-size: 13px; font-weight: 600; border-bottom: 1px dashed var(--proto); }
.protobar button { border: 1px solid var(--proto); background: transparent; color: var(--proto); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }

/* ——— app ——— */
.appbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); min-height: 64px; }
.logo { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--brand); color: var(--brand-fg); font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
.appbar .t { min-width: 0; }
.appbar .t strong { display: block; font-size: 16px; line-height: 1.2; }
.appbar .t span { display: block; font-size: 13px; color: var(--muted-fg); }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--brand-text); font-weight: 600; padding: 8px 4px; margin-left: -4px; min-height: 44px; }

.screen { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px; }
.screen.center { justify-content: center; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-fg); font-weight: 700; }
.hello { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.tint { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 25%, var(--border)); }
.card .eyebrow { font-size: 13px; font-weight: 700; color: var(--brand-text); display: flex; align-items: center; gap: 6px; }
.card h3 { font-size: 18px; line-height: 1.25; }
.card .sub { color: var(--muted-fg); font-size: 15px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.meta { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.meta div { display: flex; gap: 10px; align-items: flex-start; }
.meta svg { flex: none; margin-top: 2px; color: var(--muted-fg); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-size: 16px; font-weight: 700; text-decoration: none; }
.btn-primary { background: var(--brand); color: var(--brand-fg); }
.btn-outline { background: var(--card); color: var(--fg); border-color: var(--border); }
.btn-soft { background: var(--brand-soft); color: var(--brand-text); }
.btn-big { min-height: 64px; font-size: 20px; border-radius: 14px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--brand-text); font-weight: 600; padding: 8px 0; text-align: left; min-height: 44px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.brand { background: var(--brand-soft); color: var(--brand-text); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted { background: var(--muted); color: var(--muted-fg); }

.note { font-size: 14px; color: var(--muted-fg); }
.status { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: var(--r); font-size: 15px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.info { background: var(--info-soft); color: var(--info); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status svg { flex: none; margin-top: 2px; }

.list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; width: 100%; min-height: 64px; }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .grow strong { font-size: 16px; line-height: 1.3; }
.item .grow span { font-size: 14px; color: var(--muted-fg); }
.item .chev { color: var(--muted-fg); flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; }
.date { flex: none; width: 52px; text-align: center; border-radius: 12px; padding: 6px 0; background: var(--muted); }
.date b { display: block; font-size: 20px; line-height: 1.1; }
.date small { display: block; font-size: 12px; font-weight: 700; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.04em; }
.date.brand { background: var(--brand); color: var(--brand-fg); }
.date.brand small { color: color-mix(in srgb, var(--brand-fg) 80%, transparent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }

.month { font-size: 15px; font-weight: 800; padding: 4px 2px; }
.box { background: var(--muted); border-radius: var(--r); padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.box strong { font-size: 14px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--muted); border-radius: 10px; padding: 10px 12px; user-select: all; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); font-weight: 800; font-size: 14px; }
.step .c { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 15px; }
.field input, .field textarea { width: 100%; border: 1px solid color-mix(in srgb, var(--muted-fg) 55%, var(--card)); background: var(--card); border-radius: 10px; padding: 12px 14px; font-size: 16px; min-height: 48px; }
.field textarea { min-height: 110px; resize: vertical; }
.pwd { position: relative; }
.pwd button { position: absolute; right: 6px; top: 6px; border: 0; background: transparent; color: var(--brand-text); font-weight: 700; font-size: 14px; min-height: 36px; padding: 0 10px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.check input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--brand); }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; border: 0; background: transparent; color: var(--muted-fg); font-size: 12.5px; font-weight: 600; padding: 6px 2px; }
.tab[aria-current="page"] { color: var(--brand-text); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }

.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90%; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .22s ease-out; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--border); align-self: center; }
.sheet h2 { font-size: 20px; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

.toast { position: absolute; left: 16px; right: 16px; bottom: 78px; z-index: 30; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4); }

.qr { align-self: center; background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
.qr img, .qr canvas { display: block; width: 180px; height: 180px; }
.thumb { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 12px; }
.thumb img { width: 56px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--muted); }
.thumb .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.thumb .grow strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.wa { display: flex; flex-direction: column; gap: 12px; }
.wa .who { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.wa .bubble { background: var(--card); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; padding: 12px 14px; font-size: 15.5px; display: flex; flex-direction: column; gap: 8px; max-width: 92%; }
.wa .bubble time { align-self: flex-end; font-size: 12px; color: var(--muted-fg); }
.tag-sim { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--proto); background: var(--proto-soft); border-radius: 6px; padding: 3px 8px; }

.areas { display: flex; flex-direction: column; gap: 12px; }
.area { display: flex; gap: 14px; align-items: center; text-align: left; border: 2px solid var(--border); background: var(--card); border-radius: 18px; padding: 18px 16px; min-height: 96px; }
.area .ic { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); }
.area strong { display: block; font-size: 18px; }
.area span { display: block; font-size: 14px; color: var(--muted-fg); }

.big-pct { font-size: 40px; font-weight: 800; line-height: 1; color: var(--brand-text); font-variant-numeric: tabular-nums; }
details.acc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0 16px; }
details.acc summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc[open] summary svg { transform: rotate(90deg); }
details.acc .in { padding-bottom: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--muted); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 700; color: var(--muted-fg); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
.auth-brand .logo { background: #a64b22; color: #fff; }

/* ——— painel do roteiro ——— */
.panel h1 { font-size: 22px; letter-spacing: -0.01em; }
.panel .lead { color: var(--muted-fg); font-size: 14.5px; }
.pcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard > strong { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-fg); }
.journey { display: flex; gap: 10px; align-items: flex-start; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 10px; width: 100%; }
.journey:hover { background: var(--muted); }
.journey .j { flex: none; font-size: 12px; font-weight: 800; color: var(--proto); background: var(--proto-soft); border-radius: 6px; padding: 2px 6px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.journey b { display: block; font-size: 14.5px; }
.journey span { display: block; font-size: 13.5px; color: var(--muted-fg); }
.task { background: var(--proto-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; border-left: 3px solid var(--proto); }
.task b { color: var(--proto); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.opt .seg { min-width: 170px; }
.swatches { display: flex; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14.5px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--proto); }
.small-btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
</style>

<div class="stage">
  <aside class="panel" id="panel" aria-label="Roteiro do protótipo"></aside>
  <div class="device" id="device"></div>
</div>

  }
  function sampleReceipt() {
    var c = document.createElement('canvas'); c.width = 300; c.height = 400; var x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 300, 400); x.fillStyle = '#0f172a'; x.font = 'bold 22px sans-serif'; x.fillText('Comprovante PIX', 24, 50);
    x.font = '16px sans-serif'; x.fillStyle = '#475569';
    ['Valor: R$ 50,00', 'Para: Tenda Luz da Mata', 'Data: 07/10/2026 14:31', 'EXEMPLO · protótipo'].forEach(function (t, i) { x.fillText(t, 24, 100 + i * 34); });
    return c.toDataURL('image/png');
  }
  function now() { var d = new Date(); return d.getHours() + 'h' + String(d.getMinutes()).padStart(2, '0'); }
  function copyText(t, okMsg) {
    var done = function () { toast(okMsg); };
    try { navigator.clipboard.writeText(t).then(done, function () { toast('Toque e segure o código para copiar.'); }); }
    catch (e) { toast('Toque e segure o código para copiar.'); }
  }

  /* ——————————————————— eventos ——————————————————— */
  function onClick(e) {
    var el = e.target.closest('[data-go],[data-act],[data-tab]'); if (!el) return;
    if (el.tagName === 'INPUT' && el.type === 'checkbox' && !el.dataset.act) return;
    var a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
    if (el.dataset.tab) return tab(el.dataset.tab);
    if (el.dataset.go) return go(el.dataset.go, { id: id });
    switch (a) {
      case 'back': return back();
      case 'proto': return sheet('proto');
      case 'fechar': S.sheet = null; return render();
      case 'vou': S.escala[id] = { resp: 'vou' }; return toast('Combinado! A casa já sabe que você vai.');
      case 'naovou': return sheet('naovou', { id: id });
      case 'mudar': delete S.escala[id]; return render();
      case 'enviar-motivo': {
        var m = (document.getElementById('motivo').value || '').trim(); if (!m) return;
        S.escala[S.sheetData.id] = { resp: 'nao', motivo: m }; S.sheet = null; return toast('A casa foi avisada. Obrigado por avisar.');
      }
      case 'justificar': return sheet('justificar', { id: id });
      case 'enviar-just': {
        var mj = (document.getElementById('motivo').value || '').trim(); if (!mj) return;
        S.justificados[S.sheetData.id] = mj; S.sheet = null; return toast('Motivo enviado para a casa.');
      }
      case 'cheguei': S.cheguei[id] = true; return toast('Presença marcada. Bom trabalho!');
      case 'pagar': return sheet('pagar');
      case 'comprovante': return sheet('comprovante');
      case 'copiar': {
        if (v === 'code') return copyText(PIX_CODE, 'Código copiado. Abra o app do banco e escolha PIX copia e cola.');
        if (v === 'chave') return copyText(CASA.pix, 'Chave PIX copiada.');
        return copyText(el.dataset.txt, 'Copiado.');
      }
      case 'exemplo': S.file = { name: 'comprovante-pix.png', size: '84 KB', url: sampleReceipt() }; return render();
      case 'trocar-arq': S.file = null; return render();
      case 'enviar-comp': S.mensal = 'conferencia'; S.enviadoEm = now(); S.sheet = null; S.file = null; if (S.screen !== 'mensalidade') { S.history = []; S.screen = 'mensalidade'; } return toast('Comprovante enviado. A casa vai conferir.');
      case 'filtro': S.agendaFiltro = v; return render();
      case 'agendacel': return toast('No app, isso baixa o evento para a agenda do celular (Google ou Apple).');
      case 'divulgar': return sheet('divulgar', { id: id });
      case 'falar': return sheet('falar');
      case 'instalar': return sheet('instalar');
      case 'plat': S.sheetData.plat = v; return render();
      case 'fechar-inst': S.installSeen = true; S.sheet = null; return render();
      case 'termo': return sheet('termo');
      case 'showpw': case 'showpw2': {
        var inp = el.parentNode.querySelector('input'); var show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.textContent = show ? 'Ocultar' : 'Mostrar'; return;
      }
      case 'ativar': {
        var pw = document.getElementById('pw').value, ok = document.getElementById('termo').checked, err = document.getElementById('err'), msg = document.getElementById('errmsg');
        if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) { msg.textContent = 'A senha precisa ter 8 ou mais caracteres, com letras e números.'; err.hidden = false; return; }
        if (!ok) { msg.textContent = 'Para ativar, marque que você autoriza o uso dos seus dados.'; err.hidden = false; return; }
        S.logged = true; S.history = []; S.screen = 'inicio'; render(); return sheet('instalar');
      }
      case 'entrar': S.logged = true; S.history = []; if (S.persona === 'operador') return go('escolher-area', {}, { replace: true }); return tab('inicio');
      case 'esqueci': return sheet('esqueci');
      case 'enviar-reset': S.sheet = null; return toast('Se o e-mail tiver acesso, chega um link em alguns minutos.');
      case 'area': {
        var lb = document.getElementById('lembrar'); if (lb) S.lembrar = lb.checked;
        S.history = []; return v === 'painel' ? go('painel', {}, { replace: true }) : tab('inicio');
      }
      case 'sair': S.history = []; return go('login', {}, { replace: true });
      case 'journey': {
        var jj = J[+el.dataset.i]; S.task = jj; S.sheet = null; jj.start(); return;
      }
      case 'diafaxina': S.diaFaxina = el.checked; if (S.diaFaxina) delete S.escala.f1; return render();
      case 'sim-mensal': S.mensal = v; S.sheet = null; return render();
      case 'persona': S.persona = v; return render();
      case 'brand': document.documentElement.style.setProperty('--brand', v); try { localStorage.setItem('am-proto-brand', v); } catch (e2) {} return render();
      case 'reset': { var keep = S.persona; S = fresh(); S.persona = keep; return render(); }
    }
  }
  document.addEventListener('click', function (e) { if (device.contains(e.target) || panel.contains(e.target)) onClick(e); });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'motivo') { var b = device.querySelector('[data-act="enviar-motivo"],[data-act="enviar-just"]'); if (b) b.disabled = !e.target.value.trim(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'arq' && e.target.files && e.target.files[0]) {
      var f = e.target.files[0]; var kb = Math.round(f.size / 1024);
      S.file = { name: f.name, size: kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB', url: /^image\//.test(f.type) ? URL.createObjectURL(f) : sampleReceipt() };
      render();
    }
    if (e.target.dataset && e.target.dataset.act === 'diafaxina') { S.diaFaxina = e.target.checked; if (S.diaFaxina) delete S.escala.f1; render(); }
  });

  render();
})();
</script>
