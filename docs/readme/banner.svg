<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="GiraHub — A senha da gira no celular. A fila em paz no portão.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26170f"/>
      <stop offset="1" stop-color="#180e09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#c0612f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c0612f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3cb74" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3cb74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf8f2"/>
      <stop offset="1" stop-color="#f7eee1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="28" fill="url(#glow)"/>

  <!-- pontinhos de luz (velas ao fundo) -->
  <g fill="url(#flame)">
    <circle cx="1180" cy="80" r="26"/>
    <circle cx="700" cy="460" r="18"/>
    <circle cx="1230" cy="430" r="20"/>
    <circle cx="640" cy="70" r="14"/>
  </g>

  <!-- marca -->
  <g transform="translate(72,70)">
    <g transform="scale(1.75)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
      <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
    </g>
    <text x="54" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#ffffff">GiraHub</text>
  </g>

  <!-- selo -->
  <g transform="translate(72,150)">
    <rect width="452" height="36" rx="18" fill="#3b2519" stroke="#f3cb74" stroke-opacity="0.35"/>
    <text x="226" y="24" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="600" font-size="16" fill="#f3cb74">Para terreiros de Umbanda, Candomblé e casas de axé</text>
  </g>

  <!-- promessa -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" fill="#ffffff">
    <text x="72" y="262" font-size="52" letter-spacing="-1">A senha da gira no celular.</text>
    <text x="72" y="326" font-size="52" letter-spacing="-1">A fila em <tspan fill="#e9b04a">paz</tspan> no portão.</text>
  </g>
  <text x="72" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#eedfc8">Senha online · Porta e Modo TV · Corrente · PIX · Área do Médium</text>

  <!-- provas -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f7eee1">
    <g transform="translate(72,420)">
      <circle cx="9" cy="9" r="9" fill="#c0612f"/><path d="M5 9.5l2.8 2.6L13 6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="15">Grátis para começar</text>
    </g>
    <g transform="translate(262,420)">
      <circle cx="9" cy="9" r="9" fill="#c0612f"/><path d="M5 9.5l2.8 2.6L13 6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="15">30 dias de Premium sem cartão</text>
    </g>
    <g transform="translate(540,420)">
      <circle cx="9" cy="9" r="9" fill="#c0612f"/><path d="M5 9.5l2.8 2.6L13 6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="15">Sem app para o consulente</text>
    </g>
  </g>

  <!-- bilhete -->
  <g transform="translate(1040,236) rotate(-6) scale(0.9)" filter="url(#shadow)">
    <path d="M-170 -150 h340 a18 18 0 0 1 18 18 v92 a24 24 0 0 0 0 48 v220 a18 18 0 0 1 -18 18 h-340 a18 18 0 0 1 -18 -18 v-220 a24 24 0 0 0 0 -48 v-92 a18 18 0 0 1 18 -18 z" fill="url(#ticket)"/>
    <text x="0" y="-104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#a64b22">GIRA DE OXÓSSI · SÁB 19H</text>
    <text x="0" y="-62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" letter-spacing="5" fill="#86391a" opacity="0.75">SUA SENHA</text>
    <line x1="-150" y1="-34" x2="150" y2="-34" stroke="#e0c9a6" stroke-width="2.5" stroke-dasharray="8 7" stroke-linecap="round"/>
    <text x="0" y="96" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="118" font-weight="800" fill="#3b2519" letter-spacing="2">P007</text>
    <rect x="-64" y="128" width="128" height="30" rx="15" fill="#c0612f"/>
    <text x="0" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Preferencial</text>
    <text x="0" y="200" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#86391a">Chegue até 18h40 · axé!</text>
  </g>
</svg>
