# ============================================================
# Initial deployment WITHOUT SSL
# Use this for the FIRST deploy while obtaining SSL certificates.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.init-ssl.yml up -d
#
# After obtaining certs:
#   certbot certonly --standalone -d YOUR_DOMAIN -d api.YOUR_DOMAIN
#   cp /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem ./certs/
#   cp /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem   ./certs/
#
# Then switch to full production:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  nginx:
    volumes:
      - ./nginx/conf.d/senhas-init.conf:/etc/nginx/conf.d/senhas.conf:ro
      - /dev/null:/etc/nginx/certs/fullchain.pem:ro
      - /dev/null:/etc/nginx/certs/privkey.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
