# ============================================================
# Initial deployment WITHOUT SSL
# Use this for the FIRST deploy while obtaining SSL certificates.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.init-ssl.yml up -d
#
# After obtaining certs:
#   certbot certonly --standalone -d girahub.com.br -d www.girahub.com.br
#   cp /etc/letsencrypt/live/girahub.com.br/fullchain.pem ./certs/
#   cp /etc/letsencrypt/live/girahub.com.br/privkey.pem   ./certs/
#
# Then switch to full SSL:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
# ============================================================

services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/senhas-init.conf:/etc/nginx/conf.d/senhas.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
