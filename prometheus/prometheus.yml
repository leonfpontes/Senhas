global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: "senhas-backend"
    static_configs:
      - targets: ["backend:9090"]
    metrics_path: /metrics
    honor_labels: true

  - job_name: "senhas-postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
