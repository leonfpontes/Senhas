# Workflow reutilizável com os jobs de teste (bloqueantes).
# Chamado por: ci.yml (pull requests / branches) e deploy.yml (push na master).
# Item I-04 do docs/plano-execucao.md — uma única definição dos testes pra
# não divergirem entre o sinal de PR e o gate de deploy.
name: Tests

on:
  workflow_call:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Testes backend (bloqueante) — tests/unit/ + tests/api/ (banco mockado).
  # A suíte com Postgres real roda no job test-backend-integration abaixo.
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        env:
          DEBUG: "true"
        run: python -m pytest tests/unit/ tests/api/ --no-cov

      - name: Audit — grupos de permissão em endpoints admin
        working-directory: backend
        run: python scripts/audit_permission_guards.py

      - name: Audit — isolamento de tenant (admin, repositories/services, public, FKs da requisição)
        working-directory: backend
        run: python scripts/audit_tenant_isolation.py

  # ──────────────────────────────────────────────────────────────────────────
  # Integração com Postgres real (bloqueante) — item Q-01 do plano.
  # App FastAPI inteiro via httpx (middlewares, JWT, Depends de RBAC) contra
  # Postgres 15 com o schema criado pelas migrações do Alembic: emissão
  # concorrente, isolamento de tenant, RBAC, webhook Stripe e migrações.
  # ──────────────────────────────────────────────────────────────────────────
  test-backend-integration:
    name: Backend Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres sobe num passo, não em `services:` — o service puxa de um registry só e, se ele
    # recusar, o job (e o deploy, que chama este workflow) cai. Pull anônimo de runner do GitHub é
    # limitado nos espelhos: Docker Hub em 09/10 ("toomanyrequests") e ECR Public em 15/10
    # ("toomanyrequests: Data limit exceeded", 3 vezes). Tenta os três, na ordem, mesma imagem.
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Subir Postgres 15 (registry com fallback)
        run: |
          IMAGE=""
          for img in mirror.gcr.io/library/postgres:15-alpine \
                     public.ecr.aws/docker/library/postgres:15-alpine \
                     docker.io/library/postgres:15-alpine; do
            for tentativa in 1 2; do
              if docker pull -q "$img"; then IMAGE="$img"; break 2; fi
              sleep 5
            done
          done
          [ -n "$IMAGE" ] || { echo "::error::Nenhum registry entregou postgres:15-alpine"; exit 1; }
          echo "Imagem: $IMAGE"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=senhas_test -e POSTGRES_PASSWORD=senhas_test -e POSTGRES_DB=senhas_test \
            "$IMAGE"
          # Via TCP: durante o initdb o servidor temporário só escuta no socket local.
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U senhas_test -d senhas_test && exit 0
            sleep 2
          done
          docker logs postgres; exit 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      # Drift modelos × migrações: o schema migrado é a fonte da verdade
      # (é o que existe em produção). O conftest da suíte recria o schema
      # depois, então rodar as migrações aqui não interfere nos testes.
      - name: Alembic — schema migrado = modelos
        working-directory: backend
        env:
          INTEGRATION_PG: "1"
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://senhas_test:senhas_test@localhost:5432/senhas_test
          STRIPE_WEBHOOK_SECRET: whsec_integration_ci
        run: python -m alembic upgrade head && python -m alembic check

      - name: Run Postgres integration tests
        working-directory: backend
        env:
          INTEGRATION_PG: "1"
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://senhas_test:senhas_test@localhost:5432/senhas_test
          STRIPE_WEBHOOK_SECRET: whsec_integration_ci
        run: python -m pytest tests/integration_pg --no-cov -p no:cacheprovider

  # ──────────────────────────────────────────────────────────────────────────
  # Testes frontend (bloqueante) — lint, type-check, jest, audit de RBAC e
  # build. Histórico: lint/tsc já tiveram débito real (334 problemas), zerado
  # antes de virarem bloqueantes — manter em zero.
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --ci

      - name: Audit — usePermissions em telas admin
        working-directory: frontend
        run: node scripts/audit-permission-guards.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit — sintaxe do build no Safari do iOS 15
        working-directory: frontend
        run: node scripts/audit-legacy-syntax.js
