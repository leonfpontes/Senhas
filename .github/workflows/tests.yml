# Workflow reutilizável com os jobs de teste (bloqueantes).
# Chamado por: ci.yml (pull requests / branches) e deploy.yml (push na master).
# Item I-04 do docs/plano-execucao.md — uma única definição dos testes pra
# não divergirem entre o sinal de PR e o gate de deploy.
name: Tests

on:
  workflow_call:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Testes backend (bloqueante) — tests/unit/ + tests/api/.
  # tests/integration/ fica de fora: chama APIs que não existem mais
  # (reescrita dedicada prevista no item Q-01 do plano de execução).
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        env:
          DEBUG: "true"
        run: python -m pytest tests/unit/ tests/api/ --no-cov

      - name: Audit — grupos de permissão em endpoints admin
        working-directory: backend
        run: python scripts/audit_permission_guards.py

  # ──────────────────────────────────────────────────────────────────────────
  # Testes frontend (bloqueante) — lint, type-check, jest, audit de RBAC e
  # build. Histórico: lint/tsc já tiveram débito real (334 problemas), zerado
  # antes de virarem bloqueantes — manter em zero.
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/shared-ui

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --ci

      - name: Audit — usePermissions em telas admin
        working-directory: frontend
        run: node scripts/audit-permission-guards.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build
