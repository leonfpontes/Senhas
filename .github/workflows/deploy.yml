name: Deploy → VPS

on:
  push:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Auditoria de segurança de dependências (não bloqueia deploy, mas notifica)
  # ──────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true   # não bloqueia deploy — apenas gera relatório
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit --quiet
          pip install . --quiet
          pip-audit --format=columns || true

      - name: Node.js dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────────────────────────────────
  # Testes backend (bloqueante) — tests/unit/ + tests/api/ (874 testes).
  # tests/integration/ (test_concurrent_emission.py, test_email_workflow.py)
  # fica de fora: chama APIs que não existem mais no repositório/serviço
  # atual (SenhaControlRepositoryExtended.atomic_increment, campos antigos de
  # Gira, render_ticket_template) — precisa de reescrita dedicada, não é
  # débito mecânico. Ver conversa/PR de contexto.
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        env:
          DEBUG: "true"
        run: python -m pytest tests/unit/ tests/api/ --no-cov

      - name: Audit — grupos de permissão em endpoints admin
        working-directory: backend
        run: python scripts/audit_permission_guards.py

  # ──────────────────────────────────────────────────────────────────────────
  # Testes frontend (bloqueante) — lint, type-check, jest, build e audit de
  # RBAC. Antes rodavam em dois jobs (build bloqueante + "quality report"
  # informativo com continue-on-error) porque havia débito técnico real:
  # 334 problemas de lint e erros de tsc em 7 arquivos. Esse débito foi
  # eliminado (lint 0/0, tsc limpo, no-explicit-any 0) — ver conversa/PR de
  # contexto — então lint/type-check/jest passam a bloquear o deploy também.
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/shared-ui

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --ci

      - name: Audit — usePermissions em telas admin
        working-directory: frontend
        run: node scripts/audit-permission-guards.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy principal
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Hostinger
    needs: [test-backend, test-frontend]   # security-audit fica fora (não-bloqueante)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/senhas

            echo "==> [1/6] Backup do banco antes do deploy"
            BACKUP_FILE="/opt/senhas/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            mkdir -p /opt/senhas/backups
            # Lê variáveis do .env — não dependem do ambiente do runner
            DB_USER=$(grep -E '^DB_USER=' /opt/senhas/.env | cut -d= -f2)
            DB_NAME=$(grep -E '^DB_NAME=' /opt/senhas/.env | cut -d= -f2)
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U "$DB_USER" "$DB_NAME" \
              | gzip > "$BACKUP_FILE"
            echo "Backup salvo: $BACKUP_FILE"
            # Mantém apenas os 10 backups mais recentes
            ls -t /opt/senhas/backups/pre-deploy-*.sql.gz | tail -n +31 | xargs -r rm --

            echo "==> [2/6] Pull do código"
            git fetch --all
            git reset --hard origin/master

            echo "==> [3/6] Build das novas imagens (containers antigos ainda rodando)"
            docker compose -f docker-compose.prod.yml build --no-cache frontend backend

            echo "==> [4/6] Migrations"
            # Roda migration em container temporário enquanto prod ainda está up
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              alembic upgrade head

            echo "==> [5/6] Swap dos containers (downtime mínimo)"
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans frontend backend

            echo "==> [5b] Recriar nginx (aplica mudanças de config)"
            # 'nginx -s reload' NÃO basta: o bind mount de arquivo único fica preso ao
            # inode antigo depois de um 'git reset --hard' (que substitui o arquivo em vez
            # de editar em place), então o container continua servindo a config anterior
            # até ser recriado. É preciso recriar incluindo o overlay de SSL, senão o
            # nginx perde os mounts de conf.d/certs que só existem em docker-compose.ssl.yml.
            docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d --no-deps --force-recreate nginx
            sleep 2
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t

            echo "==> [6/6] Health check pós-deploy"
            sleep 5
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check OK (tentativa $i)"
                break
              fi
              echo "Health check falhou ($STATUS), aguardando... ($i/5)"
              sleep 5
              if [ $i -eq 5 ]; then
                echo "ERRO: Backend não respondeu após deploy. Verifique os logs."
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
            done

            echo "==> Status final"
            docker compose -f docker-compose.prod.yml ps
