name: Deploy → VPS

on:
  push:
    branches: [master]

# Serializa deploys na VPS: dois runs simultâneos intercalam comandos
# docker compose via SSH no mesmo /opt/senhas (observado em produção em
# 2026-08-26). cancel-in-progress: false — o run em andamento termina e o
# mais recente fica na fila (pushes intermediários pendentes são descartados
# pelo GitHub, o que é desejado: só o último estado do master importa).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Auditoria de segurança de dependências (não bloqueia deploy, mas notifica)
  # ──────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true   # não bloqueia deploy — apenas gera relatório
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit --quiet
          pip install . --quiet
          # setuptools vem no ambiente de build (nao e dependencia de runtime do
          # app) mas o pip-audit o audita porque esta instalado; sobe pro patch
          # mais recente pra nao acusar CVE de ferramenta de build (ex. PYSEC-2026-3447).
          pip install --upgrade pip setuptools --quiet
          # Sem advisories ignoradas: as 5 que ficavam aqui (PYSEC-2026-161, 248,
          # 249, 2280, 2281 — todas do starlette 0.x, a 249 e DoS em request.form)
          # foram corrigidas na migracao pra fastapi 0.142.2 + starlette 1.7.0
          # (Q-06 etapa final, 2026-10-06). Advisory nova sem correcao entra
          # com --ignore-vuln e justificativa, nunca em silencio.
          pip-audit --format=columns

      - name: Node.js dependency audit
        working-directory: frontend
        # audit-ci em vez de `npm audit` cru pra ter allowlist por advisory (o
        # npm audit nao tem). Config em frontend/audit-ci.jsonc: falha em high+,
        # audita so producao (skip-dev) e allowlista so advisories de ferramentas
        # de build sem versao corrigida alcancavel (hoje: postcss pinado pelo
        # Next; justificativa no proprio jsonc). Roda via npx sem
        # precisar de node_modules (le o package-lock.json do workspace).
        run: npx --yes audit-ci@^7 --config audit-ci.jsonc

  # ──────────────────────────────────────────────────────────────────────────
  # Testes (bloqueantes) — definidos uma única vez em tests.yml e compartilhados
  # com o CI de pull request (ci.yml). Item I-04 do docs/plano-execucao.md.
  # ──────────────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy principal
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Hostinger
    needs: [tests]   # security-audit fica fora (não-bloqueante)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # WhatsApp comercial (V-06): variável do ambiente Hostinger no GitHub. É ARG de build do
          # frontend; quando preenchida, sobrescreve a do /opt/senhas/.env no docker compose build.
          NEXT_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
          # Divulgação da Área do Médium (AM-24): "true" liga o link "Sou médium", a linha no
          # comparativo de planos e a pergunta no FAQ. Sem a variável = desligada (padrão false).
          NEXT_PUBLIC_AREA_MEDIUM_DIVULGADA: ${{ vars.NEXT_PUBLIC_AREA_MEDIUM_DIVULGADA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Default da action é 10m para o script inteiro. O deploy de 2026-10-05
          # (run 37318551000) estourou: build do frontend com Next 15 levou 387s
          # (era 304s no Next 14) e o total passou de 10m — a action matou a sessão
          # entre as migrations e o swap dos containers. timeout-minutes do job (25)
          # continua sendo o teto real.
          command_timeout: 30m
          envs: NEXT_PUBLIC_SUPPORT_WHATSAPP,NEXT_PUBLIC_AREA_MEDIUM_DIVULGADA
          script: |
            set -euo pipefail
            cd /opt/senhas

            echo "==> [1/6] Backup do banco antes do deploy"
            BACKUP_FILE="/opt/senhas/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            mkdir -p /opt/senhas/backups
            # Lê variáveis do .env — não dependem do ambiente do runner
            DB_USER=$(grep -E '^DB_USER=' /opt/senhas/.env | cut -d= -f2)
            DB_NAME=$(grep -E '^DB_NAME=' /opt/senhas/.env | cut -d= -f2)
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U "$DB_USER" "$DB_NAME" \
              | gzip > "$BACKUP_FILE"
            echo "Backup salvo: $BACKUP_FILE"
            # Mantém apenas os 30 backups mais recentes
            ls -t /opt/senhas/backups/pre-deploy-*.sql.gz | tail -n +31 | xargs -r rm --

            echo "==> [2/6] Pull do código"
            git fetch --all
            git reset --hard origin/master

            echo "==> [3/6] Build das novas imagens (containers antigos ainda rodando)"
            # Vazio no GitHub = vale o /opt/senhas/.env (variável de shell vence o .env no compose).
            if [ -z "${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}" ]; then unset NEXT_PUBLIC_SUPPORT_WHATSAPP; fi
            if [ -z "${NEXT_PUBLIC_AREA_MEDIUM_DIVULGADA:-}" ]; then unset NEXT_PUBLIC_AREA_MEDIUM_DIVULGADA; fi
            docker compose -f docker-compose.prod.yml build frontend backend

            echo "==> [4/6] Migrations"
            # Roda migration em container temporário enquanto prod ainda está up
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              alembic upgrade head

            echo "==> [5/6] Swap dos containers (downtime mínimo)"
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans frontend backend

            echo "==> [5b] Recriar nginx (aplica mudanças de config)"
            # 'nginx -s reload' NÃO basta: o bind mount de arquivo único fica preso ao
            # inode antigo depois de um 'git reset --hard' (que substitui o arquivo em vez
            # de editar em place), então o container continua servindo a config anterior
            # até ser recriado. É preciso recriar incluindo o overlay de SSL, senão o
            # nginx perde os mounts de conf.d/certs que só existem em docker-compose.ssl.yml.
            docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d --no-deps --force-recreate nginx
            sleep 2
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t

            echo "==> [6/6] Health check pós-deploy"
            sleep 5
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check OK (tentativa $i)"
                break
              fi
              echo "Health check falhou ($STATUS), aguardando... ($i/5)"
              sleep 5
              if [ $i -eq 5 ]; then
                echo "ERRO: Backend não respondeu após deploy. Verifique os logs."
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
            done

            echo "==> Status final"
            docker compose -f docker-compose.prod.yml ps
