name: Monitor → produção

# Monitor sem serviço externo: se um passo falhar, o GitHub manda e-mail sobre a falha do
# workflow (notificações de Actions da conta). Não altera nada em produção.
#  - a cada 15 min: site e API respondendo (4 tentativas em ~6 min, para não alarmar com oscilação de rede);
#  - todo dia 06:10 UTC (depois do backup das 03:15): backup concluído e no bucket, disco e
#    containers (devops/monitor/check-vps.sh via SSH, só leitura).

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  disponibilidade:
    name: Site e API no ar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir site e API (4 tentativas em ~6 min)
        # As tentativas cobrem ~6 min de propósito: em 18/10/2026 o runner do GitHub ficou ~4 min sem
        # rota até a VPS (o Sentry Uptime via 200 no mesmo intervalo) e as 3 tentativas em 2 min davam
        # alarme falso. Queda de verdade continua sendo pega na mesma execução.
        run: |
          set -u
          URLS="https://girahub.com.br/health https://girahub.com.br/login"
          for t in 1 2 3 4; do
            pendentes=""
            for url in $URLS; do
              # curl já escreve 000 em -w quando não conecta; o código de saída diz o motivo
              # (6 = DNS, 7 = conexão recusada, 28 = timeout).
              rc=0
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url") || rc=$?
              if [ "$codigo" = "200" ]; then
                echo "ok $url"
              else
                echo "tentativa $t: $url → HTTP $codigo (curl $rc)"
                pendentes="$pendentes $url"
              fi
            done
            [ -z "$pendentes" ] && exit 0
            URLS=$pendentes
            [ "$t" -lt 4 ] && sleep 60
          done
          for url in $URLS; do echo "::error::$url não respondeu 200 em 4 tentativas (~6 min)"; done
          exit 1

  vps:
    name: Backup, disco e containers
    if: github.event.schedule == '10 6 * * *' || github.event_name == 'workflow_dispatch'
    # Os segredos da VPS (VPS_HOST/VPS_USER/VPS_SSH_KEY) são do ambiente Hostinger, como no deploy.
    environment: Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificação diária na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: bash /opt/senhas/devops/monitor/check-vps.sh
