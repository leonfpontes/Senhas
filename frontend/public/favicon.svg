<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Ticket shape -->
  <g transform="translate(256,256)" filter="url(#shadow)">
    <!-- Main ticket body -->
    <rect x="-150" y="-120" width="300" height="240" rx="24" fill="white" opacity="0.95"/>
    <!-- Ticket notches (left and right) -->
    <circle cx="-150" cy="0" r="22" fill="url(#bg)"/>
    <circle cx="150" cy="0" r="22" fill="url(#bg)"/>
    <!-- Dashed separator line -->
    <line x1="-120" y1="0" x2="-30" y2="0" stroke="#c7d2fe" stroke-width="3" stroke-dasharray="8,6"/>
    <line x1="30" y1="0" x2="120" y2="0" stroke="#c7d2fe" stroke-width="3" stroke-dasharray="8,6"/>
    <!-- Stylized "S" letter -->
    <text x="0" y="22" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="140" fill="url(#bg)">S</text>
    <!-- Small star/sparkle accent -->
    <g transform="translate(90,-70)">
      <path d="M0,-18 L5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5Z" fill="url(#accent)" opacity="0.9"/>
    </g>
    <!-- Number lines (bottom section) -->
    <rect x="-100" y="40" width="80" height="8" rx="4" fill="#e0e7ff"/>
    <rect x="-100" y="58" width="55" height="8" rx="4" fill="#e0e7ff"/>
  </g>
</svg>
