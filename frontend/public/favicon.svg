<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#312e81" flood-opacity="0.3"/>
    </filter>
    <clipPath id="notchClip">
      <rect width="300" height="240" rx="20"/>
      <rect x="-22" y="98" width="44" height="44" rx="22"/>
      <rect x="278" y="98" width="44" height="44" rx="22"/>
    </clipPath>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="108" ry="108" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
  <!-- Ticket group -->
  <g transform="translate(256,250)" filter="url(#shadow)">
    <!-- Ticket body -->
    <rect x="-140" y="-110" width="280" height="220" rx="20" fill="url(#ticket)"/>
    <!-- Left notch -->
    <circle cx="-140" cy="0" r="20" fill="#4f46e5"/>
    <!-- Right notch -->
    <circle cx="140" cy="0" r="20" fill="#4f46e5"/>
    <!-- Perforated line -->
    <line x1="-110" y1="0" x2="-24" y2="0" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="6,5" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="110" y2="0" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="6,5" stroke-linecap="round"/>
    <!-- Bold "S" -->
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="130" fill="#4f46e5" letter-spacing="-4">S</text>
    <!-- Ticket number bars -->
    <rect x="-80" y="38" width="64" height="7" rx="3.5" fill="#ddd6fe" opacity="0.8"/>
    <rect x="-80" y="52" width="44" height="7" rx="3.5" fill="#ddd6fe" opacity="0.6"/>
    <!-- Top decorative bar -->
    <rect x="-80" y="-80" width="100" height="7" rx="3.5" fill="#ddd6fe" opacity="0.5"/>
    <rect x="30" y="-80" width="50" height="7" rx="3.5" fill="#ddd6fe" opacity="0.35"/>
    <!-- Shine accent (top-right corner sparkle) -->
    <g transform="translate(95,-65)">
      <path d="M0,-14 L4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4Z" fill="url(#accent)"/>
    </g>
    <g transform="translate(75,-45) scale(0.5)">
      <path d="M0,-14 L4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4Z" fill="url(#accent)" opacity="0.6"/>
    </g>
  </g>
</svg>
